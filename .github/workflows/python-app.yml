name: LPO data AI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest>=8.0.0 pytest-asyncio>=0.24.0 ruff>=0.4.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

  # Les tests couvrent le serveur MCP en stdio et en streamable-http : ils
  # démarrent de vrais sous-processus, d'où l'absence de base externe à fournir.
  # Aucune clé LLM n'est nécessaire : l'extraction d'intention est testée avec un
  # modèle factice.
